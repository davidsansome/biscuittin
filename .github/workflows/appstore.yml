name: App Store

# Run by hand. Submits an existing TestFlight build for review, unchanged; it is released as
# soon as Apple approves it. Release notes come from fastlane/release_notes.txt, and the
# screenshots in fastlane/screenshots replace the ones in App Store Connect.
on:
  workflow_dispatch:
    inputs:
      build:
        description: TestFlight build number to submit (blank for the latest processed build)
        required: false
        default: ""

concurrency:
  group: appstore
  cancel-in-progress: false

permissions:
  contents: write # push the v<version> tag and the next-version commit

jobs:
  submit:
    name: Submit for review
    runs-on: ubuntu-latest
    environment: app-store
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # build/<N> tags, to tag the release's commit

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Submit to App Store review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ inputs.build }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          bundle exec fastlane app_store ${BUILD:+build:"$BUILD"}
