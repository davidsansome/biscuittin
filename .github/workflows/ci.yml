name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # The models are gitignored, and a build without them has no search bar and skips the
      # tokenizer tests (AGENTS.md). Keyed on the script, which pins the revisions it fetches.
      - name: Cache CLIP models
        uses: actions/cache@v4
        with:
          path: BiscuitTin/Resources/Models
          key: clip-models-${{ hashFiles('Tools/fetch_models.sh') }}

      - name: Fetch CLIP models
        run: Tools/fetch_models.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('BiscuitTin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Several simulators on the runner image share names, so target one by UDID.
      - name: Pick simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(p) for p in r.split(".iOS-")[1].split("-")])
          for runtime in reversed(ios):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")
          ')
          echo "Using simulator $udid"
          xcrun simctl list devices | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Ad-hoc signing: the simulator needs no provisioning, and the committed team's
      # certificates are not on the runner.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project BiscuitTin.xcodeproj \
            -scheme BiscuitTin \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER=

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
